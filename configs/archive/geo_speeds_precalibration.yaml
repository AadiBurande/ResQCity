# ARCHIVED: speed settings used before the D-014 calibration (2026-10-20). Overlay for
#   uv run python -m geo.sanity --geo-overlay configs/archive/geo_speeds_precalibration.yaml \
#       --out results/geo/sanity_travel_times_precalibration.csv
# Kept only so results/geo/sanity_travel_times_precalibration.csv is reproducible. Do not use.
base_speeds_kph:
  trunk: {value: 45.0, source: UNVERIFIED}
  primary: {value: 35.0, source: UNVERIFIED}
  secondary: {value: 30.0, source: UNVERIFIED}
  tertiary: {value: 25.0, source: UNVERIFIED}
  residential: {value: 20.0, source: UNVERIFIED}
  service: {value: 15.0, source: UNVERIFIED}
