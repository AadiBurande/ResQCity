#       --template --out results/geo/maps_check_template.csv
# then fill google_typical_min_low/high from Google Maps ("Depart at" Tuesday, same hour,
# the "typically X-Y min" range). `pairs` were used for the speed calibration (D-014);
# `holdout_pairs` were not, so they are the independent check.
