# Synthetic incident generator (ground truth for the simulator). EVERYTHING HERE IS SYNTHETIC.
# Every behavioural parameter is a {value, source} pair; UNVERIFIED values are listed by
# common.config.find_unverified and are sensitivity factors in phase 10.
synthetic: true

base_rate_per_day:
  value: 5.54
  source: >
    Derived (D-018): (fires + road accidents) / 365 = (1107 + 915) / 365.
    Fires: mean "Fire" calls 2015-2019 = 1107/yr, PMC Fire Call Statistics 2011-2020
    (data.opencity.in, Pune Municipal Corporation, public domain).
    Road accidents: 334 road deaths in Pune city in 2023 (Pune city police, via Punekar News,
    2024-01-13) divided by the national severity index 36.5 deaths per 100 accidents
    (MoRTH, Road Accidents in India 2022, via Outlook Business) = 915/yr.
  note: >
    Applying the national severity index to a city probably UNDER-estimates accidents (urban crashes
    are less often fatal), and police-registered figures miss unreported crashes. The phase-10
    sensitivity sweep covers 0.5x-4x of this rate. Superseded value: 24.0/day (assumption).

# Type mix follows the same derivation: accidents 915/2022 = 0.45, fires 1107/2022 = 0.55, then
# small assumed shares for crowd/other events are taken out of both.

# Relative intensity by local hour 0..23 (normalised to mean 1 at load time).
hour_profile:
  value: [0.45, 0.35, 0.30, 0.30, 0.35, 0.50, 0.75, 0.95, 1.15, 1.30, 1.25, 1.15,
          1.10, 1.10, 1.10, 1.15, 1.25, 1.40, 1.55, 1.50, 1.35, 1.10, 0.85, 0.65]
  source: UNVERIFIED
# Relative intensity Monday..Sunday (normalised to mean 1 at load time).
weekday_profile:
  value: [1.00, 0.97, 0.97, 0.98, 1.03, 1.05, 1.00]
  source: UNVERIFIED

# Node hotspot weight = sum over incident roads (each two-way road counted once) of class_weight,
# times junction_bonus if the node is an intersection (>= 3 distinct neighbours).
# Incidents are placed on in-city nodes only. NOTE (threat to validity, D-016): this spatial model
# follows OSM road density, not observed crash locations.
hotspot:
  class_weight:
    value: {trunk: 4.0, primary: 3.0, secondary: 2.0, tertiary: 1.2, residential: 0.5, service: 0.2}
    source: UNVERIFIED
  junction_bonus: {value: 1.5, source: UNVERIFIED}

# Multiplier on the rate = min(max_multiplier, 1 + per_mm_h * rain_mm_h).
rain_effect:
  per_mm_h: {value: 0.05, source: UNVERIFIED}
  max_multiplier: {value: 2.0, source: UNVERIFIED}

type_mix:
  value: {accident: 0.44, fire_smoke: 0.53, crowd: 0.01, other: 0.02}
  source: UNVERIFIED
  note: "accident/fire split derived from the base-rate sources (D-018); crowd/other assumed"

# Feature model used to sample observable cues per incident type (SYNTHETIC). These set the share
# of multi-agency incidents, which strongly affects RQ2, so they are sensitivity factors.
features:
  heavy_vehicle_classes: [truck, bus]   # definition, not a parameter
  vehicle_class_mix:
    value: {car: 0.42, motorcycle: 0.36, auto_rickshaw: 0.08, truck: 0.09, bus: 0.05}
    source: UNVERIFIED
  accident:
    value:
      extra_vehicles_mean: 0.8          # num_vehicles = 1 + Poisson(mean), capped
      max_vehicles: 6
      p_person_down: 0.35
      p_overturned: 0.04
      p_overturned_heavy: 0.12          # if a heavy vehicle is involved
      p_fire_visible: 0.03
    source: UNVERIFIED
  fire_smoke:
    value: {p_vehicle_fire: 0.25, p_person_down: 0.10}
    source: UNVERIFIED
  crowd:
    value: {p_person_down: 0.25}
    source: UNVERIFIED
  other:
    value: {p_person_down: 0.10}
    source: UNVERIFIED
