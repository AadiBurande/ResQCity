# Synthetic incident generator (ground truth for the simulator). EVERYTHING HERE IS SYNTHETIC.
# Every behavioural parameter is a {value, source} pair; UNVERIFIED values are listed by
# common.config.find_unverified and are sensitivity factors in phase 10.
synthetic: true

base_rate_per_day:
  value: 5.59
  source: >
    Derived by resqcity.sim.base_rate (results/calibration/base_rate.json; D-026):
    (fires + road accidents) / 365 / (1 - 0.03 assumed crowd/other share).
    Fires: mean "Fire" calls 2015-2019 = 1107.4/yr, PMC Fire Call Statistics 2011-2020
    (data.opencity.in, Pune Municipal Corporation, public domain).
    Road accidents: 871 in 2022, MoRTH "Road Accidents in India 2022", Table 6.2 (Pune).
    Accidents + fires = 5.42/day.
  note: >
    Police-registered accidents; Pune's registered crashes are unusually severe (killed per 100
    accidents: Pune vs all million-plus cities, results/calibration/base_rate.json), which suggests
    non-fatal crashes are under-registered, so
    this is likely a LOWER bound. Phase-10 sensitivity covers 0.5x-4x. Superseded values:
    24.0/day (assumption), 5.54 and 5.71/day (death-count / severity-index proxy).

# Relative intensity by local hour 0..23 (normalised to mean 1 at load time).
hour_profile:
  value: [0.5027, 0.5027, 0.5027, 0.3887, 0.3887, 0.3887, 0.7598, 0.7598, 0.7598, 1.1522, 1.1522,
          1.1522, 1.2041, 1.2041, 1.2041, 1.3753, 1.3753, 1.3753, 1.6095, 1.6095, 1.6095, 1.0076,
          1.0076, 1.0076]
  source: >
    MoRTH "Road Accidents in India 2022", Annexure 42 (Maharashtra, road accidents by 3-hour
    interval), spread evenly within each interval (resqcity.sim.base_rate).
  note: "State-level road accidents (incl. highways). Used for every type without its own profile."
# Per-type hour profiles that replace hour_profile for that type (each normalised to mean 1).
type_hour_profiles:
  fire_smoke:
    value: [0.5027, 0.5027, 0.5027, 0.3887, 0.3887, 0.3887, 0.7598, 0.7598, 0.7598, 1.1522, 1.1522,
             1.1522, 1.2041, 1.2041, 1.2041, 1.3753, 1.3753, 1.3753, 1.6095, 1.6095, 1.6095, 1.0076,
             1.0076, 1.0076]
    source: UNVERIFIED
    note: >
      Assumed equal to the road-accident profile: no Pune fire-calls-by-hour data was found
      (fires are ~54 % of incidents). Phase-10 sensitivity factor.
# Relative intensity Monday..Sunday (normalised to mean 1 at load time).
weekday_profile:
  value: [1.00, 0.97, 0.97, 0.98, 1.03, 1.05, 1.00]
  source: UNVERIFIED

# Node hotspot weight = sum over incident roads (each two-way road counted once) of class_weight,
# times junction_bonus if the node is an intersection (>= 3 distinct neighbours).
# Incidents are placed on in-city nodes only. NOTE (threat to validity, D-016): this spatial model
# follows OSM road density, not observed crash locations.
hotspot:
  class_weight:
    value: {trunk: 4.0, primary: 3.0, secondary: 2.0, tertiary: 1.2, residential: 0.5, service: 0.2}
    source: UNVERIFIED
  junction_bonus: {value: 1.5, source: UNVERIFIED}

# Multiplier on the rate = min(max_multiplier, 1 + per_mm_h * rain_mm_h).
rain_effect:
  per_mm_h: {value: 0.05, source: UNVERIFIED}
  max_multiplier: {value: 2.0, source: UNVERIFIED}

type_mix:
  value: {accident: 0.427, fire_smoke: 0.543, crowd: 0.01, other: 0.02}
  source: UNVERIFIED
  note: "accident/fire split from results/calibration/base_rate.json; crowd/other (0.03) assumed, added on top"

# Feature model used to sample observable cues per incident type (SYNTHETIC). These set the share
# of multi-agency incidents, which strongly affects RQ2, so they are sensitivity factors.
features:
  heavy_vehicle_classes: [truck, bus]   # definition, not a parameter
  vehicle_class_mix:
    value: {car: 0.42, motorcycle: 0.36, auto_rickshaw: 0.08, truck: 0.09, bus: 0.05}
    source: UNVERIFIED
  accident:
    value:
      extra_vehicles_mean: 0.8          # num_vehicles = 1 + Poisson(mean), capped
      max_vehicles: 6
      p_person_down: 0.35
      p_overturned: 0.04
      p_overturned_heavy: 0.12          # if a heavy vehicle is involved
      p_fire_visible: 0.03
    source: UNVERIFIED
  fire_smoke:
    value: {p_vehicle_fire: 0.25, p_person_down: 0.10}
    source: UNVERIFIED
  crowd:
    value: {p_person_down: 0.25}
    source: UNVERIFIED
  other:
    value: {p_person_down: 0.10}
    source: UNVERIFIED
