# Evaluation v5 stage-A candidate (pre-registration amendment 1, docs/plans/phase-3b.md; D-027).
# Validation for every candidate: fit-split windows of UCF-Crime AND ACCIDENT, official labels.
clip_classifier:
  backbone: vjepa2_vitl
  input_size: 256     # V-JEPA 2 crop (extract.VIDEO_SETTINGS)
  clip_frames: 16
  labels: mil
  sources: [ucf_crime, accident]
  train_sources: [ucf_crime, accident]
  mil_sparsity: 0.3   # v4 fold-A choice (s03_t1), fixed for all v5 candidates
  mil_smoothness: 1.0
