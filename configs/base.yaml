# ResQCity base configuration. Loaded by common.config.load_base_config().
# Every other config file (scenarios, fleet, requirements, survival, ...) is added in its phase.

project:
  name: ResQCity
  timezone: Asia/Kolkata

paths:            # relative to the project root
  data_raw: data/raw
  data_processed: data/processed
  results: results
  configs: configs

random:
  # Replication r of an experiment uses streams seeded from (seed_base, r, stream name).
  # Separate bases keep tuning / forecast training / evaluation data disjoint.
  seed_base: 20261020                     # evaluation (confirmatory experiments)
  tuning_seed_base: 31102026              # threshold and parameter tuning (RQ3)
  forecast_training_seed_base: 7041990    # synthetic history for forecasting

# Geography (study area, wards, network, speeds) lives in configs/geo.yaml.
