# Inputs for the cited base incident rate and hour profile (D-018, corrected in D-025, D-026).
#   uv run python -m resqcity.sim.morth_extract   -> results/calibration/morth_2022_extract.json
#   uv run python -m resqcity.sim.base_rate       -> results/calibration/base_rate.json
# configs/incidents.yaml must agree with base_rate.json (tested).
fire_calls:
  url: https://data.opencity.in/dataset/49fd476d-ace4-4610-918c-cb09f4171cb2/resource/5bd37e88-583b-46a3-b0a4-01be071c14c0/download/ad3c3c8a-6df0-4297-86cc-5db40b7ac3f9.csv
  raw_file: pmc/pune_fire_call_statistics_2011_2020.csv      # under data/raw
  source: "PMC Fire Call Statistics 2011-2020 (OpenCity / Pune Municipal Corporation, public domain)"
  call_types: ["Fire"]   # structural/vehicle fires only; excluded: garbage, short circuit, gas/oil leaks,
                         # tree falls, rescues (not CCTV-relevant fire_smoke incidents of this study)
  years: [2015, 2016, 2017, 2018, 2019]   # 2020 excluded (COVID); most recent five normal years
road_accidents:
  extract_file: calibration/morth_2022_extract.json   # under results/
  year: 2022
  source: "MoRTH, Road Accidents in India 2022, Table 6.2 (Pune, million-plus city): 871 accidents"
hour_profile:
  source: "MoRTH, Road Accidents in India 2022, Annexure 42 (Maharashtra, accidents by 3-hour interval; unknown time excluded)"
assumed_extra_share:     # crowd + other events, ADDED on top of accidents + fires (assumption)
  value: 0.03
  source: UNVERIFIED
caveats:
  - "Years differ: fires 2015-2019, road accidents 2022."
  - "MoRTH city figures are police-registered accidents; Pune's registered accidents are severe (325 killed per 871 accidents = 37 per 100, vs 22 for all million-plus cities), suggesting under-registration of non-fatal crashes."
  - "Police jurisdiction (Pune city) is not identical to the 58 PMC wards."
  - "Hour profile is for all Maharashtra road accidents (state level, incl. highways) and is applied to fires too."
