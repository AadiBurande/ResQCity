# Local hooks use the project's own (uv-locked) tool versions, so pre-commit and CI never disagree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ts-types
        name: dashboard TypeScript types up to date
        entry: uv run python -m resqcity.tools.gen_ts_types --check
        language: system
        pass_filenames: false
        files: ^(src/resqcity/common/schemas\.py|src/resqcity/tools/gen_ts_types\.py|dashboard/src/types/schemas\.ts)$
