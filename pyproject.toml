[project]
name = "resqcity"
version = "0.1.0"
description = "CCTV-triggered, confidence-aware joint multi-agency dispatch on the Pune road network (research prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "geopandas>=1.0",
    "h3>=4.1",
    "matplotlib>=3.8",
    "networkx>=3.3",
    "numpy>=1.26",
    "osmnx>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "tzdata>=2024.1",  # IANA zones for zoneinfo on Windows
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "common",
    "geo",
    "vision",
    "streams",
    "fusion",
    "forecasting",
    "optimization",
    "sim",
    "backend",
    "experiments",
    "paper",
    "tools",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"*.ipynb" = ["ANN", "E501"]  # exploratory notebooks: no annotations, long plot calls

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs internet access (never run in CI)",
    "slow: long-running test",
]
