[project]
name = "resqcity"
version = "0.1.0"
description = "CCTV-triggered, confidence-aware joint multi-agency dispatch on the Pune road network (research prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "geopandas>=1.0",
    "h3>=4.1",
    "matplotlib>=3.8",
    "networkx>=3.3",
    "numpy>=1.26",
    "osmnx>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "tzdata>=2024.1",  # IANA zones for zoneinfo on Windows
    "opencv-python-headless>=4.10",  # video I/O, blur; also used by streams tooling
    "pypdf>=4.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

vision = [
    # Heavy vision stack (GPU PyTorch, CUDA 12.6 wheels). In the default groups, so `uv sync` and
    # `make setup` keep it; CI skips it with `--no-group vision`.
    # Ultralytics is AGPL-3.0 (accepted by the user, D-019).
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "scikit-learn>=1.5",
    "gdown>=5.2",  # Google Drive downloads (CADP)
    "transformers>=5.5",
    "accelerate>=1.10",
    "bitsandbytes>=0.48",
    "kaggle>=2.0",
    "einops>=0.8",
]

[tool.uv]
default-groups = ["dev", "vision"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resqcity"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["/dashboard", "/data", "/results"]  # anchored: a bare "data" would also skip src/.../data

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"*.ipynb" = ["ANN", "E501"]  # exploratory notebooks: no annotations, long plot calls

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs internet access (never run in CI)",
    "slow: long-running test",
]
