source: 'measured: results/vision/v5 (detection on the ACCIDENT IID test clips; road
  false alarms on their pre-impact footage plus UA-DETRAC normal road CCTV; none used
  for training or selection; evaluation v5, protocol pre-registered before the holdout
  and amended after validation, amendment 2)'
evaluation_version: 5
detection_rule: alarm in [t* - 1 s, t* + 10 s]; earlier alarms are road false alarms
caveat: Public CCTV clips (mostly US, ~20 % elsewhere), trimmed around a crash; detection
  is markedly lower on non-US clips. False alarms per camera-hour below are capped
  by the 60 s cooldown and mix two very different sources (pre-impact footage vs normal
  traffic); the simulator should use false_alarm_model. Not Pune cameras.
synthetic: false
deployed:
  run: v5_vjepa_mil_all
  detector: coco
  operating_point:
    threshold: 0.3
    consecutive_windows: 4
  verifier: tau_r1_classifier
  tau: 0.2
