false_alarm_model:
  status: exploratory re-expression of the final run (exploratory.json); not pre-registered
  definition: Poisson alarms at rate lambda while armed; after each alarm the camera
    is silent for 60 s; long-run rate = lambda / (1 + lambda * cooldown). Cluster
    intervals resample clips / sequences (UA-DETRAC recording sites are not identified).
  default: ua_detrac_normal_traffic
  cooldown_s: 60.0
  rate_per_armed_hour:
    accident_pre_impact:
      rate: 792.4037370117309
      cluster_bootstrap_ci95:
      - 606.2259518135072
      - 1037.5961239141322
    ua_detrac_normal_traffic:
      rate: 55.11666360462981
      cluster_bootstrap_ci95:
      - 38.54342128734896
      - 77.1014226819353
  accident_pre_impact_reading: 'not a hazard rate: about half of the clips with pre-impact
    footage alarm at the first possible instant, so this mostly measures clip-start
    firing on short trimmed clips (clip_start.pre_impact)'
