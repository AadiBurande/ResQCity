simulator_defaults:
  status: exploratory (not pre-registered); replaces the pre-registered ACCIDENT detection
    rate, which mostly reflects clip trimming (content-free baseline above it)
  detection_probability_when_armed: 0.5869565217391305
  detection_probability_ci95:
  - 0.5035370012843488
  - 0.6656659961276075
  detection_basis: ACCIDENT holdout clips with lead time and no earlier alarm (81/138);
    the simulator models masking by the cooldown itself through the false-alarm process
  delay_median_s: 2.875
  false_alarm_source: ua_detrac_normal_traffic
  false_alarm_rate_per_armed_hour: 55.11666360462981
  false_alarm_rate_ci95:
  - 38.54342128734896
  - 77.1014226819353
  cooldown_s: 60.0
  phase10_ranges:
    detection_probability:
    - 0.2111665900314018
    - 0.6656659961276075
    detection_basis: 'lower: the lower of the Wilson low of lead-time clips counting
      masked crashes as misses (81/281) and of non-US armed clips (11/31); upper:
      armed clips (Wilson high)'
    false_alarm_rate_per_armed_hour:
    - 38.54342128734896
    - 77.1014226819353
    false_alarm_basis: UA-DETRAC sequence-clustered bootstrap interval
    false_alarm_stress_per_camera_hour: 60.0
    stress_basis: a camera that alarms at every opportunity (one alarm per cooldown)
source: 'measured: results/vision/v5 (detection on the ACCIDENT IID test clips; road
  false alarms on their pre-impact footage plus UA-DETRAC normal road CCTV; none used
  for training or selection; evaluation v5, protocol pre-registered before the holdout
  and amended after validation, amendment 2)'
evaluation_version: 5
detection_rule: alarm in [t* - 1 s, t* + 10 s]; earlier alarms are road false alarms
caveat: 'Public CCTV clips (216/1520 = 14.2% outside the US), trimmed around a crash;
  detection is markedly lower on non-US clips. The pre-registered fields below are
  kept for the record: the detection rate mostly reflects clip trimming (a content-free
  alarm at the warm-up end scores higher) and the false alarms per camera-hour are
  capped by the 60 s cooldown and mix two very different sources. The simulator uses
  simulator_defaults. Not Pune cameras.'
synthetic: false
deployed:
  run: v5_vjepa_mil_all
  detector: coco
  operating_point:
    threshold: 0.3
    consecutive_windows: 4
  verifier: tau_r1_classifier
  tau: 0.2
